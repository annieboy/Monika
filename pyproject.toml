[project]
name = "monika"
version = "0.1.0"
description = "AI-powered personal finance assistant for the UK"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115,<1.0",
    # Configuration
    "pydantic-settings>=2.7,<3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    # Cache
    "redis[hiredis]>=5.2,<6.0",
    # HTTP client
    "httpx>=0.28,<1.0",
    # AI
    "anthropic>=0.43,<1.0",
    # Encryption
    "cryptography>=44.0,<45.0",
    # Auth tokens
    "python-jose[cryptography]>=3.3,<4.0",
    # Logging
    "structlog>=25.1,<26.0",
    # Retry logic
    "tenacity>=9.0,<10.0",
    # Error tracking (configured later)
    "sentry-sdk[fastapi]>=2.20,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.28,<1.0",
    "factory-boy>=3.3,<4.0",
    "faker>=33.0,<34.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
    "pre-commit>=4.1,<5.0",
    # mypy stubs
    "types-redis>=4.6,<5.0",
    "types-python-jose>=3.3,<4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# ── Ruff (linting + formatting) ───────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
ignore = [
    "B008",  # do not perform function calls in default args (FastAPI Depends pattern)
    "SIM108", # ternary operator — readability preference
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
exclude = ["alembic/", "frontend/"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "--cov=backend --cov-report=term-missing --cov-report=html --cov-fail-under=0"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "alembic/*"]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.3.0",
]
